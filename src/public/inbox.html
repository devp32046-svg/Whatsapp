<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CGPE Team Inbox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0b141a; --panel:#111b21; --panel2:#202c33; --green:#00a884; --txt:#e9edef; --sub:#8696a0; --in:#202c33; --out:#005c4b; --hum:#144d37; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); height: 100vh; display: flex; overflow: hidden; }
  #list { width: 340px; background: var(--panel); border-right: 1px solid #222d34; display: flex; flex-direction: column; }
  #list h1 { font-size: 15px; padding: 14px 16px; background: var(--panel2); color: var(--green); letter-spacing: .3px; }
  #list h1 small { color: var(--sub); font-weight: 400; display:block; font-size:11px; margin-top:2px; }
  #threads { overflow-y: auto; flex: 1; }
  .thread { padding: 11px 16px; border-bottom: 1px solid #1a252c; cursor: pointer; }
  .thread:hover { background: var(--panel2); }
  .thread.active { background: var(--panel2); }
  .thread .top { display: flex; justify-content: space-between; align-items: baseline; }
  .thread .nm { font-size: 14px; font-weight: 600; }
  .thread .pv { color: var(--sub); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; background: var(--green); color: #04150f; padding: 1px 7px; border-radius: 10px; font-weight: 700; }
  #chat { flex: 1; display: flex; flex-direction: column; }
  #chhead { padding: 12px 18px; background: var(--panel2); display: flex; justify-content: space-between; align-items: center; }
  #chead .who { font-size: 15px; font-weight: 600; }
  #chead .st { font-size: 11.5px; color: var(--sub); }
  #chead button { background: #2a3942; color: var(--txt); border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  #chead button:hover { background: #37474f; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 8vw; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 68%; padding: 7px 11px 5px; border-radius: 9px; font-size: 14px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
  .m .t { font-size: 10px; color: var(--sub); text-align: right; margin-top: 2px; }
  .m.in { background: var(--in); align-self: flex-start; border-top-left-radius: 2px; }
  .m.bot { background: var(--out); align-self: flex-end; border-top-right-radius: 2px; }
  .m.human { background: var(--hum); align-self: flex-end; border-top-right-radius: 2px; }
  .m.human::before { content: "🧑 you"; display:block; font-size:9px; color:#7fd4b3; margin-bottom:2px; }
  #composer { padding: 12px 16px; background: var(--panel2); display: flex; gap: 10px; }
  #composer input { flex: 1; background: var(--panel); color: var(--txt); border: 0; border-radius: 10px; padding: 11px 14px; font-size: 14px; outline: none; }
  #composer button { background: var(--green); color: #04150f; border: 0; padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: 700; }
  #composer button:disabled { opacity: .5; cursor: default; }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 14px; }
  .note { font-size: 11px; color: var(--sub); padding: 6px 16px; }
</style>
</head>
<body>
  <div id="list">
    <h1>CGPE Team Inbox<small>reply as human on 9904400699 · bot auto-pauses</small></h1>
    <div id="threads"></div>
  </div>
  <div id="chat">
    <div id="empty">Left se ek chat chuno</div>
  </div>

<script>
let active = null, threadTimer = null, msgTimer = null;

async function loadThreads() {
  try {
    const r = await fetch('/api/inbox/threads'); const d = await r.json();
    const box = document.getElementById('threads');
    box.innerHTML = (d.threads || []).map(t => `
      <div class="thread ${t.phone===active?'active':''}" onclick="openChat('${t.phone}','${(t.name||'').replace(/'/g,"")}')">
        <div class="top"><span class="nm">${t.name || t.phone}</span>${t.paused?'<span class="badge">HUMAN</span>':''}</div>
        <div class="pv">${escapeHtml(t.preview)}</div>
        <div class="pv" style="font-size:11px">${t.phone}</div>
      </div>`).join('') || '<div class="note">Koi conversation nahi</div>';
  } catch(e){}
}

async function openChat(phone, name) {
  active = phone;
  document.querySelectorAll('.thread').forEach(el=>el.classList.remove('active'));
  document.getElementById('chat').innerHTML = `
    <div id="chead">
      <div><div class="who">${name || phone}</div><div class="st" id="cst">${phone}</div></div>
      <button onclick="resumeBot()">🤖 Bot ko wapas do</button>
    </div>
    <div id="msgs"></div>
    <div id="composer">
      <input id="inp" placeholder="Reply type karo..." onkeydown="if(event.key==='Enter')sendReply()" autocomplete="off"/>
      <button id="snd" onclick="sendReply()">Send</button>
    </div>`;
  await loadMsgs();
  loadThreads();
  clearInterval(msgTimer); msgTimer = setInterval(loadMsgs, 4000);
}

async function loadMsgs() {
  if (!active) return;
  try {
    const r = await fetch('/api/inbox/thread?phone=' + active); const d = await r.json();
    const box = document.getElementById('msgs'); if (!box) return;
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = (d.messages || []).map(m => `
      <div class="m ${m.dir}">${escapeHtml(m.text)}<div class="t">${fmt(m.ts)}</div></div>`).join('');
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch(e){}
}

async function sendReply() {
  const inp = document.getElementById('inp'); const btn = document.getElementById('snd');
  const text = inp.value.trim(); if (!text || !active) return;
  btn.disabled = true; inp.value = '';
  try {
    const r = await fetch('/api/inbox/reply', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone: active, text }) });
    const d = await r.json();
    if (!d.sent) alert('Send fail: ' + (d.sendError || 'unknown') + '\n(Meta ka 24-ghante window khatam ho sakta hai)');
  } catch(e){ alert('Error: ' + e.message); }
  btn.disabled = false; inp.focus();
  await loadMsgs(); loadThreads();
}

async function resumeBot() {
  if (!active) return;
  await fetch('/api/inbox/resume', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone: active }) });
  document.getElementById('cst').textContent = active + ' · bot resumed';
  loadThreads();
}

function escapeHtml(s){ return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(ts){ try{ return new Date(ts).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false}); }catch(e){ return ''; } }

loadThreads();
threadTimer = setInterval(loadThreads, 5000);
</script>
</body>
</html>
